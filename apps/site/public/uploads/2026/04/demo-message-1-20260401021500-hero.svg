<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 540" role="img" aria-labelledby="title desc">
  <title id="title">Discord Blog PoC Hero</title>
  <desc id="desc">Gradient background with Discord inspired message blocks.</desc>
  <defs>
    <linearGradient id="bg" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffedd5" />
      <stop offset="100%" stop-color="#fb923c" />
    </linearGradient>
    <linearGradient id="card" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#fff7ed" stop-opacity="0.96" />
    </linearGradient>
  </defs>
  <rect width="960" height="540" fill="url(#bg)" rx="40" />
  <circle cx="170" cy="120" r="72" fill="#fff7ed" opacity="0.85" />
  <circle cx="790" cy="412" r="96" fill="#fdba74" opacity="0.35" />
  <rect x="120" y="106" width="720" height="336" rx="34" fill="url(#card)" />
  <rect x="170" y="168" width="180" height="24" rx="12" fill="#fdba74" />
  <rect x="170" y="214" width="524" height="20" rx="10" fill="#fed7aa" />
  <rect x="170" y="250" width="446" height="20" rx="10" fill="#fed7aa" />
  <rect x="170" y="318" width="136" height="36" rx="18" fill="#c2410c" />
  <text x="170" y="388" fill="#7c2d12" font-family="Hiragino Sans, Arial, sans-serif" font-size="36" font-weight="700">
    Discord to Astro Blog PoC
  </text>
</svg>
